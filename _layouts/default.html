---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}
  <!-- Clustrmaps 脚本 - 放置在body底部 -->
  <script>
  // 等待DOM完全加载
  document.addEventListener('DOMContentLoaded', function() {
    // 创建脚本容器
    var scriptContainer = document.createElement('div');
    scriptContainer.style.display = 'none'; // 隐藏容器
    document.body.appendChild(scriptContainer);
    
    // 创建脚本元素
    var script = document.createElement('script');
    script.type = 'text/javascript';
    script.id = 'clustrmaps';
    script.src = '//clustrmaps.com/map_v2.js?d=fMpC7E1DOxihNe0lw6ulVcp7WeUjmTPI_e-dGrf7VpA&cl=ffffff&w=a';
    
    // 处理脚本加载
    script.onload = function() {
      // 延迟处理，确保Clustrmaps完全初始化
      setTimeout(function() {
        // 查找所有样式元素并移动到head
        var styles = document.querySelectorAll('style');
        styles.forEach(function(style) {
          if (style.textContent.includes('jvectormap') || 
              style.textContent.includes('clustrmaps')) {
            document.head.appendChild(style);
          }
        });
        
        // 查找地图元素并移动到正确容器
        var mapElement = document.querySelector('.clustrmaps-map-container');
        var targetContainer = document.getElementById('clustrmaps-container');
        
        if (mapElement && targetContainer) {
          targetContainer.innerHTML = ''; // 清空容器
          targetContainer.appendChild(mapElement);
        }
        
        // 移除任何文本节点（CSS代码文本）
        var allElements = document.querySelectorAll('*');
        allElements.forEach(function(element) {
          for (var i = 0; i < element.childNodes.length; i++) {
            var node = element.childNodes[i];
            if (node.nodeType === 3 && 
                node.textContent.includes('jvectormap-container')) {
              element.removeChild(node);
            }
          }
        });
      }, 1000); // 1秒延迟确保Clustrmaps完全加载
    };
    
    // 将脚本添加到隐藏容器
    scriptContainer.appendChild(script);
  });
  </script>
  </body>
</html>
