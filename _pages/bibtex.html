<div id="bibtex-viewer" style="max-width: 980px;">
  <p id="bibtex-status">Loading BibTeX...</p>
  <p>
    <button id="copy-bibtex" type="button" style="display:none;">Copy BibTeX</button>
  </p>
  <pre id="bibtex-content" style="display:none; white-space: pre-wrap; word-break: break-word; border: 1px solid #ddd; padding: 1rem; border-radius: 6px; background: #fafafa;"></pre>
</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const source = params.get('url');
  const status = document.getElementById('bibtex-status');
  const content = document.getElementById('bibtex-content');
  const copyBtn = document.getElementById('copy-bibtex');

  if (!source) {
    status.textContent = 'No BibTeX URL provided.';
    return;
  }

  let parsed;
  try {
    parsed = new URL(source, window.location.origin);
  } catch (e) {
    status.textContent = 'Invalid BibTeX URL.';
    return;
  }

  if (!parsed.pathname.endsWith('.bib')) {
    status.textContent = 'The provided URL is not a .bib file.';
    return;
  }

  fetch(parsed.toString(), { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return res.text();
    })
    .then(function (text) {
      content.textContent = text;
      content.style.display = 'block';
      copyBtn.style.display = 'inline-block';
      status.innerHTML = 'BibTeX loaded from: <a href="' + parsed.toString() + '" target="_blank" rel="noopener noreferrer">source file</a>';
    })
    .catch(function (err) {
      status.innerHTML = 'Failed to load BibTeX. You can still open the source file directly: <a href="' + parsed.toString() + '" target="_blank" rel="noopener noreferrer">' + parsed.toString() + '</a>';
      console.error(err);
    });

  copyBtn.addEventListener('click', function () {
    const text = content.textContent || '';
    navigator.clipboard.writeText(text).then(function () {
      copyBtn.textContent = 'Copied';
      setTimeout(function () {
        copyBtn.textContent = 'Copy BibTeX';
      }, 1200);
    });
  });
})();
</script>
